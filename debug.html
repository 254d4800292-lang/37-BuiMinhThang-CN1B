<!DOCTYPE html>
<html>
<head>
    <title>Debug</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<h2>Chuyển đổi GPA</h2>
<input id="score" class="form-control mb-3" placeholder="Nhập điểm">
<button onclick="test()" class="btn btn-success">Kiểm tra</button>

<p id="result" class="mt-3"></p>

<script>
/*
Code đề bài:
function convertGrade(score) {
   if (score >= 8.5) return 4.0;
   else if (score >= 7.0) return 3.0;
   else if (score >= 5.5) return 2.0;
   else if (score >= 4.0) return 1.0;
   else return 0;
}
*/
// code đã sửa
function convertGrade(score){
    if(score >= 8.5) return 4;
    else if(score >= 7) return 3;
    else if(score >= 5.5) return 2;
    else if(score >= 4) return 1;
    return 0;
}
function test(){
    let s = document.getElementById("score").value;
    document.getElementById("result").innerHTML =
    "GPA: " + convertGrade(s);
}
</script>
</body>
</html>
